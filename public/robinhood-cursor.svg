<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" fill="none">
  <defs>
    <filter id="rh-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D4FF00" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00FF55" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g filter="url(#rh-glow)" transform="translate(1, 1)">
    <!-- Stem -->
    <path d="M13 13 L25 27" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M13 13 L25 27" stroke="#D4FF00" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Lower Plume -->
    <path d="M13 13 C18 15 22 19 21 24 C20 27 16 28 13 25 C10 22 10 17 13 13 Z" 
          fill="#C8F800" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Upper Plume / Arrowhead pointing to (2, 2) -->
    <path d="M2 2 C6 3 13 7 16 11 L13 13 L8 14 L2 2 Z" 
          fill="#D4FF00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
          
    <!-- Feather spine highlight -->
    <path d="M2 2 L13 13" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="2" cy="2" r="1.2" fill="#FFFFFF"/>
  </g>
</svg>